# ===== Server =====
server.port=8080

# ===== MySQL =====
# Create the database first:  CREATE DATABASE bookstore_db;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Seed sample catalogue data once on first run
spring.sql.init.mode=never

# ===== JWT =====
# Change this secret before deploying anywhere real
app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyBeforeYouDeployAnywhereReal12345678}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS (React dev server) =====
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ===== DevTools =====
spring.devtools.restart.enabled=true
